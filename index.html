<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>D25 達標工具</title>

<style>
:root {
    --red: #e4002b;
    --red-soft: #fff1f3;
    --black: #161616;
    --gray-900: #242424;
    --gray-600: #767676;
    --gray-400: #b8b8b8;
    --gray-200: #e9e9e9;
    --gray-100: #f6f6f6;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #ffffff;
    color: var(--black);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;
}

.app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    margin: 0 auto;
    padding-bottom: 50px;
}

/* =====================
   HEADER
===================== */

.header {
    padding:
        calc(32px + env(safe-area-inset-top))
        24px
        24px;
    text-align: center;
}

.brand {
    color: var(--red);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 8px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
}

.header p {
    margin: 8px 0 0;
    color: var(--gray-600);
    font-size: 13px;
}

/* =====================
   FORM
===================== */

.form {
    padding: 20px 28px;
}

.field {
    margin-bottom: 38px;
}

.field-label {
    color: var(--gray-600);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

/* =====================
   TIME INPUT
===================== */

.time-input {
    width: 100%;
    border: none;
    border-bottom: 2px solid var(--gray-200);
    border-radius: 0;
    background: transparent;
    outline: none;

    padding: 8px 0 14px;

    color: var(--black);
    font-size: 46px;
    font-weight: 750;
    letter-spacing: 6px;
    text-align: center;

    transition: border-color .2s ease;
}

.time-input::placeholder {
    color: #d7d7d7;
    font-size: 34px;
    letter-spacing: 3px;
}

.time-input:focus {
    border-color: var(--red);
}

.time-format {
    margin-top: 8px;
    color: var(--gray-400);
    font-size: 11px;
}

/* =====================
   QT
===================== */

.qt-wrap {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.qt-btn {
    height: 48px;
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    background: white;
    color: var(--gray-600);
    font-size: 16px;
    font-weight: 700;
    transition: all .15s ease;
}

.qt-btn.active {
    border-color: var(--red);
    background: var(--red);
    color: white;
}

.qt-btn:active {
    transform: scale(.96);
}

/* =====================
   BUTTON
===================== */

.main-btn {
    width: 100%;
    height: 58px;
    border: none;
    border-radius: 16px;
    background: var(--black);
    color: white;
    font-size: 17px;
    font-weight: 750;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform .15s ease;
}

.main-btn:active {
    transform: scale(.98);
}

/* =====================
   ERROR
===================== */

.error {
    display: none;
    margin-top: 18px;
    padding: 14px;
    background: var(--red-soft);
    color: var(--red);
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.6;
}

/* =====================
   RESULT
===================== */

.result {
    display: none;
    margin: 46px 28px 0;
    border-top: 1px solid var(--gray-200);
}

.result-type {
    margin-top: 28px;
    color: var(--red);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 2px;
}

.result-time {
    margin-top: 14px;
    font-size: clamp(72px, 22vw, 108px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -5px;
}

.result-subtitle {
    margin-top: 10px;
    color: var(--gray-600);
    font-size: 12px;
    letter-spacing: 1px;
}

.remaining {
    margin-top: 26px;
    padding: 18px 15px;
    background: var(--gray-100);
    border-radius: 18px;
}

.remaining-label {
    color: var(--gray-600);
    font-size: 12px;
}

.remaining-value {
    margin-top: 5px;
    font-size: 22px;
    font-weight: 750;
}

/* =====================
   STATUS
===================== */

.status {
    margin-top: 18px;
    padding: 24px 18px;
    border-radius: 18px;
    border: 1px solid var(--gray-200);
}

.status.alert {
    border-color: var(--red);
    background: var(--red-soft);
}

.status-title {
    font-size: 18px;
    font-weight: 800;
}

.status.alert .status-title {
    color: var(--red);
}

.status-text {
    margin-top: 10px;
    color: var(--gray-600);
    font-size: 13px;
    line-height: 1.9;
}

/* =====================
   DETAILS
===================== */

.details {
    margin-top: 24px;
}

.details-toggle {
    width: 100%;
    padding: 16px;
    border: none;
    background: transparent;
    color: var(--gray-600);
    font-size: 13px;
    cursor: pointer;
}

.details-content {
    display: none;
    margin-top: 5px;
    padding: 10px 20px;
    background: var(--gray-100);
    border-radius: 16px;
}

.detail-row {
    padding: 13px 0;
    border-bottom: 1px solid var(--gray-200);
}

.detail-row:last-child {
    border-bottom: none;
}

.detail-label {
    color: var(--gray-600);
    font-size: 12px;
}

.detail-value {
    margin-top: 5px;
    font-size: 15px;
    font-weight: 700;
}

/* =====================
   MOBILE
===================== */

@media (max-width: 380px) {
    .form {
        padding-left: 22px;
        padding-right: 22px;
    }

    .result {
        margin-left: 22px;
        margin-right: 22px;
    }

    .time-input {
        font-size: 40px;
    }
}

</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="brand">D25 DELIVERY</div>
        <h1>達標工具</h1>
        <p>即時單・預約單快速判斷</p>
    </header>

    <main class="form">

        <section class="field">
            <div class="field-label">落單時間</div>

            <input
                id="orderTime"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="4"
                placeholder="0000"
                autocomplete="off"
            >

            <div class="time-format">
                輸入 4 碼，例如 1507
            </div>
        </section>

        <section class="field">
            <div class="field-label">訂單時間</div>

            <input
                id="estimatedTime"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="4"
                placeholder="0000"
                autocomplete="off"
            >

            <div class="time-format">
                輸入 4 碼，例如 1540
            </div>
        </section>

        <section class="field">
            <div class="field-label">QT</div>

            <div class="qt-wrap">
                <button class="qt-btn" data-qt="15">15</button>
                <button class="qt-btn" data-qt="25">25</button>
                <button class="qt-btn" data-qt="30">30</button>
                <button class="qt-btn" data-qt="35">35</button>
            </div>
        </section>

        <button
            id="calculateBtn"
            class="main-btn"
            type="button"
        >
            判斷訂單
        </button>

        <div id="error" class="error"></div>

        <section id="result" class="result"></section>

    </main>

</div>

<script>

/* =====================
   QT
===================== */

let selectedQT = null;

const qtButtons =
    document.querySelectorAll(".qt-btn");

qtButtons.forEach(button => {

    button.addEventListener("click", () => {

        qtButtons.forEach(btn =>
            btn.classList.remove("active")
        );

        button.classList.add("active");

        selectedQT =
            Number(button.dataset.qt);

    });

});


/* =====================
   INPUT
===================== */

document
.querySelectorAll(".time-input")
.forEach(input => {

    input.addEventListener("input", function () {

        this.value =
            this.value
            .replace(/\D/g, "")
            .slice(0, 4);

    });

});


/* =====================
   PARSE TIME
===================== */

function parseTime(value) {

    if (!/^\d{4}$/.test(value)) {
        return null;
    }

    const hour =
        Number(value.slice(0, 2));

    const minute =
        Number(value.slice(2, 4));

    if (
        hour > 23 ||
        minute > 59
    ) {
        return null;
    }

    return {
        hour,
        minute
    };

}


/* =====================
   CREATE DATE
===================== */

function createTodayTime(time) {

    const now =
        new Date();

    return new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        time.hour,
        time.minute,
        0,
        0
    );

}


/* =====================
   FORMAT
===================== */

function formatTime(date) {

    const h =
        String(date.getHours())
        .padStart(2, "0");

    const m =
        String(date.getMinutes())
        .padStart(2, "0");

    return `${h}:${m}`;

}


function remainingText(minutes) {

    if (minutes < 0) {
        return `已超過 ${Math.abs(minutes)} 分鐘`;
    }

    if (minutes === 0) {
        return "時間已到";
    }

    return `剩餘 ${minutes} 分鐘`;

}


/* =====================
   CALCULATE
===================== */

document
.getElementById("calculateBtn")
.addEventListener("click", calculate);


function calculate() {

    const error =
        document.getElementById("error");

    const result =
        document.getElementById("result");

    error.style.display = "none";
    result.style.display = "none";


    const order =
        parseTime(
            document
            .getElementById("orderTime")
            .value
        );

    const estimated =
        parseTime(
            document
            .getElementById("estimatedTime")
            .value
        );


    if (
        !order ||
        !estimated ||
        selectedQT === null
    ) {

        error.textContent =
            "請完整輸入時間並選擇 QT。";

        error.style.display =
            "block";

        return;

    }


    const orderTime =
        createTodayTime(order);

    let estimatedTime =
        createTodayTime(estimated);


    /* 跨午夜 */

    if (
        estimatedTime < orderTime
    ) {

        estimatedTime =
            new Date(
                estimatedTime.getTime()
                + 86400000
            );

    }


    /* 判斷訂單類型 */

    const totalMinutes =
        Math.round(
            (
                estimatedTime - orderTime
            ) / 60000
        );

    const compareMinutes =
        totalMinutes - 14;


    const orderType =
        compareMinutes > selectedQT
            ? "預約單"
            : "即時單";


    /* 目標抵達時間 */

    let targetTime;

    if (orderType === "即時單") {

        targetTime =
            new Date(
                orderTime.getTime()
                + 25 * 60000
            );

    } else {

        targetTime =
            estimatedTime;

    }


    /* 剩餘時間 */

    const now =
        new Date();

    const remaining =
        Math.floor(
            (
                targetTime - now
            ) / 60000
        );


    const needAction =
        remaining <= 5;


    renderResult({

        orderTime: formatTime(orderTime),

        estimatedTime:
            formatTime(estimatedTime),

        totalMinutes,

        compareMinutes,

        qt: selectedQT,

        orderType,

        targetTime:
            formatTime(targetTime),

        remaining,

        needAction

    });

}


/* =====================
   RESULT
===================== */

function renderResult(data) {

    const result =
        document.getElementById("result");


    const statusClass =
        data.needAction
            ? "status alert"
            : "status";


    const statusTitle =
        data.needAction
            ? "建議立即處理"
            : "保持配送追蹤";


    const statusText =
        data.needAction
            ? `
                聯絡顧客延長送達時間<br>
                修正 POS 時間
              `
            : `
                請持續確認訂單配送進度
              `;


    result.innerHTML = `

        <div class="result-type">
            ${data.orderType}
        </div>

        <div class="result-time">
            ${data.targetTime}
        </div>

        <div class="result-subtitle">
            TARGET ARRIVAL
        </div>

        <div class="remaining">

            <div class="remaining-label">
                距離目標時間
            </div>

            <div class="remaining-value">
                ${remainingText(data.remaining)}
            </div>

        </div>

        <div class="${statusClass}">

            <div class="status-title">
                ${statusTitle}
            </div>

            <div class="status-text">
                ${statusText}
            </div>

        </div>

        <div class="details">

            <button
                class="details-toggle"
                id="detailsToggle"
            >
                查看判斷明細
            </button>

            <div
                class="details-content"
                id="detailsContent"
            >

                <div class="detail-row">
                    <div class="detail-label">
                        落單時間
                    </div>

                    <div class="detail-value">
                        ${data.orderTime}
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">
                        訂單時間
                    </div>

                    <div class="detail-value">
                        ${data.estimatedTime}
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">
                        時間差
                    </div>

                    <div class="detail-value">
                        ${data.totalMinutes} 分鐘
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">
                        扣除 14 分鐘
                    </div>

                    <div class="detail-value">
                        ${data.compareMinutes} 分鐘
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">
                        QT
                    </div>

                    <div class="detail-value">
                        ${data.qt} 分鐘
                    </div>
                </div>

            </div>

        </div>

    `;


    result.style.display =
        "block";


    const toggle =
        document.getElementById("detailsToggle");

    const details =
        document.getElementById("detailsContent");


    toggle.addEventListener("click", () => {

        const open =
            details.style.display === "block";


        details.style.display =
            open ? "none" : "block";


        toggle.textContent =
            open
                ? "查看判斷明細"
                : "收起判斷明細";

    });


    setTimeout(() => {

        result.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }, 100);

}

</script>

</body>
</html>
