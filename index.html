<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>D25 達標工具</title>

<style>
:root {
    --red: #e4002b;
    --red-dark: #bd0024;
    --red-soft: #fff2f4;

    --black: #171717;
    --gray-900: #2b2b2b;
    --gray-600: #777777;
    --gray-400: #aaaaaa;
    --gray-200: #e8e8e8;
    --gray-100: #f7f7f7;

    --white: #ffffff;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: var(--white);
}

body {
    color: var(--black);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

    text-align: center;
}

button,
input {
    font-family: inherit;
}

/* =========================
   APP
========================= */

.app {
    width: 100%;
    max-width: 540px;
    min-height: 100vh;
    margin: 0 auto;
    padding-bottom: 50px;

    text-align: center;
}

/* =========================
   HEADER
========================= */

.header {
    padding:
        calc(38px + env(safe-area-inset-top))
        24px
        28px;

    text-align: center;
}

.brand {
    color: var(--red);

    font-size: 12px;
    font-weight: 800;
    letter-spacing: 4px;

    margin-bottom: 10px;
}

.header h1 {
    margin: 0;

    color: var(--black);

    font-size: 34px;
    font-weight: 800;
    letter-spacing: -1.5px;

    text-align: center;
}

.header p {
    margin: 9px 0 0;

    color: var(--gray-600);

    font-size: 13px;

    text-align: center;
}

/* =========================
   FORM
========================= */

.form {
    width: 100%;
    padding: 18px 30px 0;

    text-align: center;
}

.field {
    width: 100%;

    margin-bottom: 40px;

    text-align: center;
}

.field-label {
    width: 100%;

    margin-bottom: 14px;

    color: var(--gray-600);

    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;

    text-align: center;
}

/* =========================
   TIME INPUT
========================= */

.time-input {
    display: block;

    width: 100%;
    height: 76px;

    margin: 0 auto;

    padding: 0 10px 12px;

    border: none;
    border-bottom: 2px solid var(--gray-200);
    border-radius: 0;

    background: transparent;

    color: var(--black);

    font-size: 48px;
    font-weight: 800;
    letter-spacing: 7px;

    text-align: center;

    outline: none;

    transition: border-color .2s ease;
}

.time-input::placeholder {
    color: #d6d6d6;

    font-size: 34px;
    font-weight: 600;
    letter-spacing: 5px;

    text-align: center;
}

.time-input:focus {
    border-bottom-color: var(--red);
}

.time-format {
    width: 100%;

    margin-top: 10px;

    color: var(--gray-400);

    font-size: 11px;

    text-align: center;
}

/* =========================
   QT
========================= */

.qt-wrap {
    width: 100%;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    gap: 8px;

    align-items: center;
    justify-content: center;
}

.qt-btn {
    height: 52px;

    border: 1px solid var(--gray-200);
    border-radius: 14px;

    background: var(--white);

    color: var(--gray-600);

    font-size: 17px;
    font-weight: 750;

    text-align: center;

    cursor: pointer;

    transition:
        background .15s ease,
        color .15s ease,
        border-color .15s ease,
        transform .15s ease;
}

.qt-btn.active {
    background: var(--red);
    border-color: var(--red);

    color: var(--white);
}

.qt-btn:active {
    transform: scale(.96);
}

/* =========================
   MAIN BUTTON
========================= */

.main-btn {
    display: block;

    width: 100%;
    height: 60px;

    margin: 0 auto;

    border: none;
    border-radius: 16px;

    background: var(--black);

    color: var(--white);

    font-size: 17px;
    font-weight: 750;
    letter-spacing: 1px;

    text-align: center;

    cursor: pointer;

    transition:
        transform .15s ease,
        background .15s ease;
}

.main-btn:active {
    transform: scale(.98);

    background: var(--red);
}

/* =========================
   ERROR
========================= */

.error {
    display: none;

    width: 100%;

    margin: 18px auto 0;
    padding: 14px;

    border-radius: 14px;

    background: var(--red-soft);

    color: var(--red);

    font-size: 13px;
    font-weight: 600;

    line-height: 1.6;

    text-align: center;
}

/* =========================
   RESULT
========================= */

.result {
    display: none;

    width: 100%;

    margin: 52px auto 0;

    padding-top: 30px;

    border-top: 1px solid var(--gray-200);

    text-align: center;
}

/* =========================
   RESULT TYPE
========================= */

.result-type {
    width: 100%;

    color: var(--red);

    font-size: 16px;
    font-weight: 800;
    letter-spacing: 3px;

    text-align: center;
}

/* =========================
   TARGET TIME
========================= */

.result-time {
    width: 100%;

    margin-top: 16px;

    color: var(--black);

    font-size: clamp(76px, 23vw, 112px);
    font-weight: 850;
    line-height: 1;

    letter-spacing: -5px;

    text-align: center;
}

.result-subtitle {
    width: 100%;

    margin-top: 13px;

    color: var(--gray-400);

    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;

    text-align: center;
}

/* =========================
   REMAINING
========================= */

.remaining {
    width: 100%;

    margin: 30px auto 0;
    padding: 20px 15px;

    border-radius: 20px;

    background: var(--gray-100);

    text-align: center;
}

.remaining-label {
    width: 100%;

    color: var(--gray-600);

    font-size: 12px;

    text-align: center;
}

.remaining-value {
    width: 100%;

    margin-top: 7px;

    color: var(--black);

    font-size: 23px;
    font-weight: 800;

    text-align: center;
}

/* =========================
   STATUS
========================= */

.status {
    width: 100%;

    margin: 18px auto 0;
    padding: 26px 18px;

    border: 1px solid var(--gray-200);
    border-radius: 20px;

    background: var(--white);

    text-align: center;
}

.status.alert {
    border-color: var(--red);

    background: var(--red-soft);
}

.status-title {
    width: 100%;

    color: var(--black);

    font-size: 19px;
    font-weight: 800;

    text-align: center;
}

.status.alert .status-title {
    color: var(--red);
}

.status-text {
    width: 100%;

    margin-top: 11px;

    color: var(--gray-600);

    font-size: 13px;

    line-height: 2;

    text-align: center;
}

/* =========================
   DETAILS
========================= */

.details {
    width: 100%;

    margin: 26px auto 0;

    text-align: center;
}

.details-toggle {
    display: block;

    width: 100%;

    margin: 0 auto;

    padding: 16px;

    border: none;

    background: transparent;

    color: var(--gray-600);

    font-size: 13px;

    text-align: center;

    cursor: pointer;
}

.details-content {
    display: none;

    width: 100%;

    margin: 4px auto 0;
    padding: 10px 20px;

    border-radius: 18px;

    background: var(--gray-100);

    text-align: center;
}

.detail-row {
    width: 100%;

    padding: 16px 0;

    border-bottom: 1px solid var(--gray-200);

    text-align: center;
}

.detail-row:last-child {
    border-bottom: none;
}

.detail-label {
    width: 100%;

    color: var(--gray-600);

    font-size: 12px;

    text-align: center;
}

.detail-value {
    width: 100%;

    margin-top: 6px;

    color: var(--black);

    font-size: 16px;
    font-weight: 750;

    text-align: center;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 380px) {

    .form {
        padding-left: 22px;
        padding-right: 22px;
    }

    .time-input {
        font-size: 42px;
    }

    .header h1 {
        font-size: 30px;
    }

}

</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">
            D25 DELIVERY
        </div>

        <h1>
            達標工具
        </h1>

        <p>
            即時單・預約單快速判斷
        </p>

    </header>


    <main class="form">

        <!-- 落單時間 -->

        <section class="field">

            <div class="field-label">
                落單時間
            </div>

            <input
                id="orderTime"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="4"
                placeholder="0000"
                autocomplete="off"
            >

            <div class="time-format">
                輸入 4 碼，例如 1507
            </div>

        </section>


        <!-- 訂單時間 -->

        <section class="field">

            <div class="field-label">
                訂單時間
            </div>

            <input
                id="estimatedTime"
                class="time-input"
                type="text"
                inputmode="numeric"
                maxlength="4"
                placeholder="0000"
                autocomplete="off"
            >

            <div class="time-format">
                輸入 4 碼，例如 1540
            </div>

        </section>


        <!-- QT -->

        <section class="field">

            <div class="field-label">
                QT
            </div>

            <div class="qt-wrap">

                <button
                    class="qt-btn"
                    type="button"
                    data-qt="15"
                >
                    15
                </button>

                <button
                    class="qt-btn"
                    type="button"
                    data-qt="25"
                >
                    25
                </button>

                <button
                    class="qt-btn"
                    type="button"
                    data-qt="30"
                >
                    30
                </button>

                <button
                    class="qt-btn"
                    type="button"
                    data-qt="35"
                >
                    35
                </button>

            </div>

        </section>


        <button
            id="calculateBtn"
            class="main-btn"
            type="button"
        >
            判斷訂單
        </button>


        <div
            id="error"
            class="error"
        ></div>


        <section
            id="result"
            class="result"
        ></section>

    </main>

</div>


<script>

/* =========================
   QT
========================= */

let selectedQT = null;

const qtButtons =
    document.querySelectorAll(".qt-btn");

qtButtons.forEach(button => {

    button.addEventListener("click", () => {

        qtButtons.forEach(btn => {

            btn.classList.remove("active");

        });

        button.classList.add("active");

        selectedQT =
            Number(button.dataset.qt);

    });

});


/* =========================
   TIME INPUT
========================= */

document
    .querySelectorAll(".time-input")
    .forEach(input => {

        input.addEventListener("input", function () {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 4);

        });

    });


/* =========================
   PARSE TIME
========================= */

function parseTime(value) {

    if (!/^\d{4}$/.test(value)) {

        return null;

    }

    const hour =
        Number(value.slice(0, 2));

    const minute =
        Number(value.slice(2, 4));

    if (
        hour > 23 ||
        minute > 59
    ) {

        return null;

    }

    return {
        hour,
        minute
    };

}


/* =========================
   CREATE TIME
========================= */

function createTodayTime(time) {

    const now =
        new Date();

    return new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        time.hour,
        time.minute,
        0,
        0
    );

}


/* =========================
   FORMAT TIME
========================= */

function formatTime(date) {

    const hour =
        String(date.getHours())
            .padStart(2, "0");

    const minute =
        String(date.getMinutes())
            .padStart(2, "0");

    return `${hour}:${minute}`;

}


function remainingText(minutes) {

    if (minutes < 0) {

        return `已超過 ${Math.abs(minutes)} 分鐘`;

    }

    if (minutes === 0) {

        return "時間已到";

    }

    return `剩餘 ${minutes} 分鐘`;

}


/* =========================
   CALCULATE
========================= */

document
    .getElementById("calculateBtn")
    .addEventListener(
        "click",
        calculate
    );


function calculate() {

    const error =
        document.getElementById("error");

    const result =
        document.getElementById("result");

    error.style.display =
        "none";

    result.style.display =
        "none";


    const order =
        parseTime(
            document
                .getElementById("orderTime")
                .value
        );

    const estimated =
        parseTime(
            document
                .getElementById("estimatedTime")
                .value
        );


    if (
        !order ||
        !estimated ||
        selectedQT === null
    ) {

        error.textContent =
            "請完整輸入時間並選擇 QT";

        error.style.display =
            "block";

        return;

    }


    const orderTime =
        createTodayTime(order);

    let estimatedTime =
        createTodayTime(estimated);


    /* 跨午夜 */

    if (
        estimatedTime < orderTime
    ) {

        estimatedTime =
            new Date(
                estimatedTime.getTime()
                + 24 * 60 * 60 * 1000
            );

    }


    /* =========================
       判斷訂單類型

       (訂單時間 - 落單時間)
       - 14

       > QT ＝ 預約單
       ≤ QT ＝ 即時單
    ========================= */

    const totalMinutes =
        Math.round(
            (
                estimatedTime -
                orderTime
            ) / 60000
        );

    const compareMinutes =
        totalMinutes - 14;


    const orderType =
        compareMinutes > selectedQT
            ? "預約單"
            : "即時單";


    /* =========================
       D25 目標時間

       即時單：
       落單 + 25 分鐘

       預約單：
       原預計送達時間
    ========================= */

    let targetTime;

    if (
        orderType === "即時單"
    ) {

        targetTime =
            new Date(
                orderTime.getTime()
                + 25 * 60000
            );

    } else {

        targetTime =
            estimatedTime;

    }


    /* =========================
       剩餘時間

       ≤ 5 分鐘
       → 建議立即處理
    ========================= */

    const now =
        new Date();

    const remaining =
        Math.floor(
            (
                targetTime -
                now
            ) / 60000
        );

    const needAction =
        remaining <= 5;


    renderResult({

        orderTime:
            formatTime(orderTime),

        estimatedTime:
            formatTime(estimatedTime),

        totalMinutes,

        compareMinutes,

        qt:
            selectedQT,

        orderType,

        targetTime:
            formatTime(targetTime),

        remaining,

        needAction

    });

}


/* =========================
   RESULT
========================= */

function renderResult(data) {

    const result =
        document.getElementById("result");


    const statusClass =
        data.needAction
            ? "status alert"
            : "status";


    const statusTitle =
        data.needAction
            ? "建議立即處理"
            : "持續配送追蹤中";


    const statusText =
        data.needAction
            ? `
                聯絡顧客延長送達時間<br>
                修正 POS 時間
            `
            : `
                請持續確認訂單配送進度
            `;


    result.innerHTML = `

        <div class="result-type">
            ${data.orderType}
        </div>

        <div class="result-time">
            ${data.targetTime}
        </div>

        <div class="result-subtitle">
            TARGET ARRIVAL
        </div>

        <div class="remaining">

            <div class="remaining-label">
                距離目標時間
            </div>

            <div class="remaining-value">
                ${remainingText(data.remaining)}
            </div>

        </div>

        <div class="${statusClass}">

            <div class="status-title">
                ${statusTitle}
            </div>

            <div class="status-text">
                ${statusText}
            </div>

        </div>

        <div class="details">

            <button
                class="details-toggle"
                id="detailsToggle"
                type="button"
            >
                查看判斷明細
            </button>

            <div
                class="details-content"
                id="detailsContent"
            >

                <div class="detail-row">

                    <div class="detail-label">
                        落單時間
                    </div>

                    <div class="detail-value">
                        ${data.orderTime}
                    </div>

                </div>

                <div class="detail-row">

                    <div class="detail-label">
                        訂單時間
                    </div>

                    <div class="detail-value">
                        ${data.estimatedTime}
                    </div>

                </div>

                <div class="detail-row">

                    <div class="detail-label">
                        時間差
                    </div>

                    <div class="detail-value">
                        ${data.totalMinutes} 分鐘
                    </div>

                </div>

                <div class="detail-row">

                    <div class="detail-label">
                        扣除 14 分鐘
                    </div>

                    <div class="detail-value">
                        ${data.compareMinutes} 分鐘
                    </div>

                </div>

                <div class="detail-row">

                    <div class="detail-label">
                        QT
                    </div>

                    <div class="detail-value">
                        ${data.qt} 分鐘
                    </div>

                </div>

                <div class="detail-row">

                    <div class="detail-label">
                        判定結果
                    </div>

                    <div class="detail-value">
                        ${data.orderType}
                    </div>

                </div>

            </div>

        </div>

    `;


    result.style.display =
        "block";


    const toggle =
        document.getElementById(
            "detailsToggle"
        );

    const details =
        document.getElementById(
            "detailsContent"
        );


    toggle.addEventListener(
        "click",
        () => {

            const isOpen =
                details.style.display === "block";


            details.style.display =
                isOpen
                    ? "none"
                    : "block";


            toggle.textContent =
                isOpen
                    ? "查看判斷明細"
                    : "收起判斷明細";

        }
    );


    setTimeout(() => {

        result.scrollIntoView({

            behavior: "smooth",

            block: "start"

        });

    }, 100);

}

</script>

</body>
</html>
