<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title> D25 達標工具</title>

<style>

/* =========================
   基本設定
========================= */

:root {
    --red: #e4002b;
    --red-dark: #c90027;
    --red-light: #fff3f5;

    --white: #ffffff;
    --bg: #f7f7f5;

    --text: #202020;
    --text-light: #777777;

    --line: #e6e6e6;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    background: var(--bg);
}

body {
    margin: 0;

    background: var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

    text-align: center;
}


/* =========================
   APP
========================= */

.app {
    width: 100%;
    max-width: 560px;

    min-height: 100vh;

    margin: 0 auto;

    background: var(--white);
}


/* =========================
   Header
========================= */

.header {
    background: var(--red);

    color: white;

    padding:
        calc(30px + env(safe-area-inset-top))
        20px
        28px;
}

.header h1 {
    margin: 0;

    font-size: 28px;

    font-weight: 800;

    letter-spacing: 1px;
}

.header p {
    margin: 8px 0 0;

    font-size: 14px;

    font-weight: 400;

    opacity: 0.9;
}


/* =========================
   Content
========================= */

.content {
    padding: 30px 22px 50px;
}


/* =========================
   Form
========================= */

.field {
    margin-bottom: 32px;
}

.field-title {
    margin-bottom: 14px;

    font-size: 17px;

    font-weight: 700;
}

.step {
    color: var(--red);

    margin-right: 4px;
}


/* =========================
   Time Input
========================= */

.time-input {
    width: 100%;

    height: 68px;

    border: 1.5px solid var(--line);

    border-radius: 14px;

    background: white;

    color: var(--text);

    font-size: 30px;

    font-weight: 700;

    letter-spacing: 8px;

    text-align: center;

    outline: none;

    transition:
        border-color .2s,
        background .2s;
}

.time-input::placeholder {
    color: #c5c5c5;

    font-size: 16px;

    letter-spacing: 2px;
}

.time-input:focus {
    border-color: var(--red);

    background: #fffafb;
}

.time-hint {
    margin-top: 9px;

    color: var(--text-light);

    font-size: 12px;
}


/* =========================
   QT
========================= */

.qt-buttons {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    border: 1.5px solid var(--line);

    border-radius: 14px;

    overflow: hidden;
}

.qt-btn {
    height: 56px;

    border: 0;

    border-right: 1px solid var(--line);

    background: white;

    color: var(--text);

    font-size: 18px;

    font-weight: 700;

    cursor: pointer;

    transition:
        background .15s,
        color .15s;
}

.qt-btn:last-child {
    border-right: none;
}

.qt-btn.active {
    background: var(--red);

    color: white;
}


/* =========================
   Main Button
========================= */

.main-btn {
    width: 100%;

    height: 60px;

    border: none;

    border-radius: 14px;

    background: var(--red);

    color: white;

    font-size: 18px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform .15s,
        background .15s;
}

.main-btn:active {
    transform: scale(.98);

    background: var(--red-dark);
}


/* =========================
   Error
========================= */

.error {
    display: none;

    margin-top: 18px;

    padding: 14px;

    border-radius: 12px;

    background: var(--red-light);

    color: var(--red);

    font-size: 14px;

    font-weight: 600;

    line-height: 1.6;
}


/* =========================
   Result
========================= */

.result {
    display: none;

    margin-top: 38px;

    border-top: 1px solid var(--line);

    border-bottom: 1px solid var(--line);
}


/* =========================
   Result Type
========================= */

.result-main {
    padding: 30px 15px 28px;
}

.result-type {
    color: var(--red);

    font-size: 28px;

    font-weight: 800;

    margin-bottom: 22px;
}

.result-label {
    color: var(--text-light);

    font-size: 15px;

    line-height: 1.7;
}

.target-time {
    margin-top: 10px;

    color: var(--text);

    font-size: 54px;

    font-weight: 800;

    letter-spacing: -1px;
}


/* =========================
   Status
========================= */

.status {
    padding: 22px 20px;

    border-top: 1px solid var(--line);
}

.status-title {
    color: var(--red);

    font-size: 19px;

    font-weight: 800;

    margin-bottom: 9px;
}

.status-text {
    color: var(--text-light);

    font-size: 14px;

    line-height: 1.8;
}


/* =========================
   Details
========================= */

.details {
    border-top: 1px solid var(--line);
}

.details-toggle {
    width: 100%;

    padding: 18px;

    border: none;

    background: white;

    color: var(--text-light);

    font-size: 14px;

    cursor: pointer;
}

.details-content {
    display: none;

    padding: 0 22px 22px;

    background: #fafafa;

    text-align: left;
}

.detail-row {
    display: flex;

    justify-content: space-between;

    gap: 15px;

    padding: 13px 0;

    border-bottom: 1px solid var(--line);

    font-size: 14px;
}

.detail-row:last-child {
    border-bottom: none;
}

.detail-label {
    color: var(--text-light);
}

.detail-value {
    font-weight: 700;

    text-align: right;
}


/* =========================
   手機微調
========================= */

@media (max-width: 380px) {

    .content {
        padding-left: 16px;
        padding-right: 16px;
    }

    .header h1 {
        font-size: 25px;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- Header -->

    <header class="header">

        <h1>D25達標工具</h1>

        <p>
            即時單・預約單快速判斷
        </p>

    </header>


    <main class="content">


        <!-- 落單時間 -->

        <section class="field">

            <div class="field-title">

                <span class="step">①</span>
                落單時間

            </div>

            <input
                type="text"
                id="orderTime"
                class="time-input"
                inputmode="numeric"
                maxlength="4"
                placeholder="例如 1507"
                autocomplete="off"
            >

            <div class="time-hint">

                輸入 4 碼時間

            </div>

        </section>


        <!-- 訂單時間 -->

        <section class="field">

            <div class="field-title">

                <span class="step">②</span>
                訂單時間

            </div>

            <input
                type="text"
                id="estimatedTime"
                class="time-input"
                inputmode="numeric"
                maxlength="4"
                placeholder="例如 1540"
                autocomplete="off"
            >

            <div class="time-hint">

                輸入 4 碼時間

            </div>

        </section>


        <!-- QT -->

        <section class="field">

            <div class="field-title">

                <span class="step">③</span>
                選擇 QT

            </div>

            <div class="qt-buttons">

                <button
                    class="qt-btn"
                    type="button"
                    data-qt="15"
                >
                    15
                </button>

                <button
                    class="qt-btn"
                    type="button"
                    data-qt="25"
                >
                    25
                </button>

                <button
                    class="qt-btn"
                    type="button"
                    data-qt="30"
                >
                    30
                </button>

                <button
                    class="qt-btn"
                    type="button"
                    data-qt="35"
                >
                    35
                </button>

            </div>

        </section>


        <!-- Main Button -->

        <button
            type="button"
            class="main-btn"
            id="calculateBtn"
        >
            開始判斷
        </button>


        <!-- Error -->

        <div
            id="error"
            class="error"
        ></div>


        <!-- Result -->

        <section
            id="result"
            class="result"
        ></section>


    </main>

</div>


<script>

/* =========================
   全域 QT
========================= */

let selectedQT = null;


/* =========================
   DOM
========================= */

const orderInput =
    document.getElementById("orderTime");

const estimatedInput =
    document.getElementById("estimatedTime");

const errorBox =
    document.getElementById("error");

const resultBox =
    document.getElementById("result");

const calculateBtn =
    document.getElementById("calculateBtn");

const qtButtons =
    document.querySelectorAll(".qt-btn");


/* =========================
   QT 選擇
========================= */

qtButtons.forEach(button => {

    button.addEventListener("click", function () {

        qtButtons.forEach(btn => {

            btn.classList.remove("active");

        });

        this.classList.add("active");

        selectedQT =
            Number(this.dataset.qt);

    });

});


/* =========================
   時間輸入
   只允許數字
========================= */

document
.querySelectorAll(".time-input")
.forEach(input => {

    input.addEventListener("input", function () {

        this.value =
            this.value
            .replace(/\D/g, "")
            .slice(0, 4);

    });

});


/* =========================
   解析 4 碼時間
========================= */

function parseTime(value) {

    if (!/^\d{4}$/.test(value)) {

        return null;

    }

    const hour =
        Number(value.slice(0, 2));

    const minute =
        Number(value.slice(2, 4));


    if (
        hour < 0 ||
        hour > 23 ||
        minute < 0 ||
        minute > 59
    ) {

        return null;

    }


    return {
        hour: hour,
        minute: minute
    };

}


/* =========================
   建立今日時間
========================= */

function createTodayTime(time) {

    const now =
        new Date();

    return new Date(

        now.getFullYear(),
        now.getMonth(),
        now.getDate(),

        time.hour,
        time.minute,
        0,
        0

    );

}


/* =========================
   格式化時間
========================= */

function formatTime(date) {

    const hour =
        String(date.getHours())
        .padStart(2, "0");

    const minute =
        String(date.getMinutes())
        .padStart(2, "0");


    return `${hour}:${minute}`;

}


/* =========================
   格式化剩餘時間
========================= */

function formatRemaining(minutes) {

    if (minutes < 0) {

        return `已超過 ${Math.abs(minutes)} 分鐘`;

    }

    if (minutes === 0) {

        return "時間已到";

    }

    return `剩餘 ${minutes} 分鐘`;

}


/* =========================
   顯示錯誤
========================= */

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


function clearError() {

    errorBox.textContent =
        "";

    errorBox.style.display =
        "none";

}


/* =========================
   計算
========================= */

calculateBtn.addEventListener(
    "click",
    calculate
);


function calculate() {


    /* 清除 */

    clearError();

    resultBox.style.display =
        "none";


    /* 取得輸入 */

    const orderValue =
        orderInput.value;

    const estimatedValue =
        estimatedInput.value;


    /* 檢查 */

    if (
        !orderValue ||
        !estimatedValue ||
        selectedQT === null
    ) {

        showError(
            "請輸入完整時間並選擇 QT。"
        );

        return;

    }


    /* 解析 */

    const orderParsed =
        parseTime(orderValue);

    const estimatedParsed =
        parseTime(estimatedValue);


    if (
        !orderParsed ||
        !estimatedParsed
    ) {

        showError(
            "時間格式錯誤，請輸入正確的 4 碼時間，例如 1507。"
        );

        return;

    }


    /* 建立時間 */

    const orderTime =
        createTodayTime(orderParsed);

    let estimatedTime =
        createTodayTime(estimatedParsed);


    /*
        跨午夜處理

        例如：

        落單 2350
        訂單 0010

        訂單時間視為隔天
    */

    if (
        estimatedTime < orderTime
    ) {

        estimatedTime =
            new Date(

                estimatedTime.getTime()
                + 24 * 60 * 60 * 1000

            );

    }


    /* =========================
       Step 1
       判斷即時單／預約單
    ========================= */


    const totalMinutes =

        Math.round(

            (
                estimatedTime
                - orderTime
            )

            / 60000

        );


    const compareMinutes =

        totalMinutes - 14;


    let orderType;


    /*
        compare > QT
        → 預約單

        compare ≤ QT
        → 即時單
    */

    if (
        compareMinutes > selectedQT
    ) {

        orderType =
            "預約單";

    } else {

        orderType =
            "即時單";

    }


    /* =========================
       Step 2
       決定 D25 目標時間
    ========================= */


    let targetTime;


    if (
        orderType === "即時單"
    ) {

        /*
            即時單：

            落單 + 25 分鐘

            抵達時間 - 落單時間
            < 26 分鐘
        */

        targetTime =
            new Date(

                orderTime.getTime()
                + 25 * 60 * 1000

            );

    }


    if (
        orderType === "預約單"
    ) {

        /*
            預約單：

            追蹤原預計送達時間
        */

        targetTime =
            estimatedTime;

    }


    /* =========================
       Step 3
       對照現在時間
    ========================= */


    const now =
        new Date();


    let remainingMinutes =

        Math.floor(

            (
                targetTime
                - now
            )

            / 60000

        );


    /*
        若剩餘時間：

        > 5 分鐘
        → 持續配送追蹤

        ≤ 5 分鐘
        → 建議立即處理

        包含：
        5 分鐘
        0 分鐘
        已超時
    */


    let needAction;


    if (
        remainingMinutes <= 5
    ) {

        needAction = true;

    } else {

        needAction = false;

    }


    /* =========================
       Step 4
       顯示結果
    ========================= */


    renderResult({

        orderTime:
            formatTime(orderTime),

        estimatedTime:
            formatTime(estimatedTime),

        qt:
            selectedQT,

        totalMinutes:
            totalMinutes,

        compareMinutes:
            compareMinutes,

        orderType:
            orderType,

        targetTime:
            formatTime(targetTime),

        remainingMinutes:
            remainingMinutes,

        remainingText:
            formatRemaining(remainingMinutes),

        needAction:
            needAction

    });

}


/* =========================
   Render Result
========================= */

function renderResult(data) {


    let statusHTML;


    if (
        data.needAction
    ) {

        statusHTML = `

            <div class="status">

                <div class="status-title">
                    建議立即處理
                </div>

                <div class="status-text">

                    聯絡顧客延長送達時間<br>

                    修正 POS 時間<br><br>

                    ${data.remainingText}

                </div>

            </div>

        `;

    } else {

        statusHTML = `

            <div class="status">

                <div class="status-title">
                    持續配送追蹤中
                </div>

                <div class="status-text">

                    ${data.remainingText}<br>

                    請持續確認配送進度

                </div>

            </div>

        `;

    }


    resultBox.innerHTML = `

        <div class="result-main">

            <div class="result-type">

                ${data.orderType}

            </div>

            <div class="result-label">

                請於以下時間前<br>

                完成「抵達」

            </div>

            <div class="target-time">

                ${data.targetTime}

            </div>

        </div>


        ${statusHTML}


        <div class="details">

            <button
                class="details-toggle"
                type="button"
                id="detailsToggle"
            >

                查看判斷明細

            </button>


            <div
                class="details-content"
                id="detailsContent"
            >

                <div class="detail-row">

                    <div class="detail-label">
                        落單時間
                    </div>

                    <div class="detail-value">
                        ${data.orderTime}
                    </div>

                </div>


                <div class="detail-row">

                    <div class="detail-label">
                        訂單時間
                    </div>

                    <div class="detail-value">
                        ${data.estimatedTime}
                    </div>

                </div>


                <div class="detail-row">

                    <div class="detail-label">
                        時間差
                    </div>

                    <div class="detail-value">
                        ${data.totalMinutes} 分鐘
                    </div>

                </div>


                <div class="detail-row">

                    <div class="detail-label">
                        扣除 14 分鐘
                    </div>

                    <div class="detail-value">
                        ${data.compareMinutes} 分鐘
                    </div>

                </div>


                <div class="detail-row">

                    <div class="detail-label">
                        QT
                    </div>

                    <div class="detail-value">
                        ${data.qt} 分鐘
                    </div>

                </div>


                <div class="detail-row">

                    <div class="detail-label">
                        判定結果
                    </div>

                    <div class="detail-value">
                        ${data.orderType}
                    </div>

                </div>

            </div>

        </div>

    `;


    resultBox.style.display =
        "block";


    /*
        判斷明細展開
    */

    const toggle =
        document.getElementById(
            "detailsToggle"
        );

    const content =
        document.getElementById(
            "detailsContent"
        );


    toggle.addEventListener(
        "click",
        function () {

            const isOpen =
                content.style.display === "block";


            if (isOpen) {

                content.style.display =
                    "none";

                toggle.textContent =
                    "查看判斷明細";

            } else {

                content.style.display =
                    "block";

                toggle.textContent =
                    "收起判斷明細";

            }

        }
    );


    /*
        手機自動捲動到結果
    */

    setTimeout(() => {

        resultBox.scrollIntoView({

            behavior: "smooth",

            block: "start"

        });

    }, 100);

}

</script>

</body>
</html>
