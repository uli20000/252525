<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title> D25 達標工具</title>

<style>
:root {
    --kfc-red: #e4002b;
    --kfc-dark-red: #bd0024;
    --kfc-light-red: #fff1f3;
    --bg: #f3f3f3;
    --text: #1f1f1f;
    --gray: #777;
    --line: #e6e6e6;
    --green: #168a45;
    --green-bg: #edf9f1;
    --orange: #f28c00;
    --orange-bg: #fff6e8;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;
}

.app {
    width: 100%;
    max-width: 600px;
    min-height: 100vh;
    margin: auto;
    background: #fff;
}

/* =========================
   Header
========================= */

.header {
    background: var(--kfc-red);
    color: #fff;
    padding:
        calc(22px + env(safe-area-inset-top))
        20px
        26px;
    position: relative;
    overflow: hidden;
}

.header::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    border: 28px solid rgba(255,255,255,.08);
    border-radius: 50%;
    right: -80px;
    top: -90px;
}

.header-content {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-box {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: #fff;
    color: var(--kfc-red);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 16px;
}

.header h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 900;
}

.header p {
    margin: 4px 0 0;
    font-size: 13px;
    opacity: .9;
}

/* =========================
   Content
========================= */

.content {
    padding: 20px 16px 40px;
}

.notice {
    background: var(--kfc-light-red);
    border-left: 5px solid var(--kfc-red);
    padding: 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 22px;
}

.notice strong {
    color: var(--kfc-red);
}

.field {
    margin-bottom: 22px;
}

label {
    display: block;
    margin-bottom: 9px;
    font-size: 15px;
    font-weight: 800;
}

.step {
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--kfc-red);
    color: #fff;
    font-size: 12px;
    margin-right: 6px;
}

input {
    width: 100%;
    height: 56px;
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 0 14px;
    font-size: 17px;
    background: #fff;
    outline: none;
}

input:focus {
    border-color: var(--kfc-red);
}

/* =========================
   QT Buttons
========================= */

.qt-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.qt-btn {
    height: 54px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: #fff;
    color: var(--text);
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: none;
    margin: 0;
    transition: .15s ease;
}

.qt-btn.active {
    background: var(--kfc-red);
    border-color: var(--kfc-red);
    color: #fff;
}

.qt-btn:active {
    transform: scale(.96);
}

/* =========================
   Main Button
========================= */

.main-btn {
    width: 100%;
    height: 60px;
    border: none;
    border-radius: 16px;
    margin-top: 4px;
    background: var(--kfc-red);
    color: #fff;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--kfc-dark-red);
}

.main-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--kfc-dark-red);
}

/* =========================
   Error
========================= */

.error {
    display: none;
    margin-top: 18px;
    padding: 14px;
    border-radius: 12px;
    background: #fff0f2;
    color: var(--kfc-red);
    text-align: center;
    font-weight: 800;
}

/* =========================
   Result
========================= */

.result {
    display: none;
    margin-top: 28px;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(0,0,0,.10);
}

.result-header {
    padding: 22px 20px;
    color: #fff;
    text-align: center;
    background: var(--kfc-red);
}

.reservation .result-header {
    background: #222;
}

.result-icon {
    font-size: 36px;
    margin-bottom: 4px;
}

.result-type {
    font-size: 30px;
    font-weight: 900;
}

/* =========================
   Target Time
========================= */

.action-area {
    padding: 28px 20px 22px;
    text-align: center;
    background: #fff;
}

.action-label {
    color: var(--gray);
    font-size: 15px;
    margin-bottom: 8px;
}

.action-text {
    font-size: 19px;
    line-height: 1.5;
    font-weight: 900;
}

.deadline-time {
    margin-top: 12px;
    font-size: 50px;
    font-weight: 900;
    letter-spacing: -2px;
    color: var(--kfc-red);
}

.reservation .deadline-time {
    color: #222;
}

/* =========================
   Status
========================= */

.status {
    margin: 0 18px 22px;
    padding: 18px;
    border-radius: 16px;
    text-align: center;
}

.status.ok {
    background: var(--green-bg);
    color: var(--green);
}

.status.late {
    background: var(--orange-bg);
    color: #8a5000;
}

.status-title {
    font-size: 19px;
    font-weight: 900;
    margin-bottom: 7px;
}

.status-text {
    font-size: 14px;
    line-height: 1.6;
}

/* =========================
   Detail
========================= */

.detail {
    border-top: 1px solid var(--line);
    background: #fafafa;
    padding: 18px 20px 24px;
}

.detail-title {
    font-size: 14px;
    font-weight: 900;
    margin-bottom: 10px;
}

.detail-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 9px 0;
    border-bottom: 1px dashed #ddd;
    font-size: 14px;
}

.detail-row:last-child {
    border-bottom: none;
}

.detail-row span:last-child {
    font-weight: 900;
    text-align: right;
}

/* =========================
   Desktop
========================= */

@media (min-width: 601px) {
    body {
        padding: 24px;
    }

    .app {
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0,0,0,.12);
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- Header -->

    <div class="header">
        <div class="header-content">

            <div class="logo-box">
                D25
            </div>

            <div>
                <h1>抵達判斷器</h1>
                <p>即時單／預約單快速追蹤</p>
            </div>

        </div>
    </div>


    <div class="content">

        <!-- Notice -->

        <div class="notice">
            輸入訂單時間並選擇 QT，
            系統將自動判斷訂單類型與
            <strong>應追蹤的抵達時間。</strong>
        </div>


        <!-- 落單時間 -->

        <div class="field">

            <label>
                <span class="step">1</span>
                落單時間
            </label>

            <input
                type="datetime-local"
                id="orderTime"
            >

        </div>


        <!-- 預計送達時間 -->

        <div class="field">

            <label>
                <span class="step">2</span>
                預計送達時間
            </label>

            <input
                type="datetime-local"
                id="estimatedTime"
            >

        </div>


        <!-- QT -->

        <div class="field">

            <label>
                <span class="step">3</span>
                選擇 QT
            </label>

            <div class="qt-buttons">

                <button
                    class="qt-btn"
                    data-qt="15"
                    type="button"
                >
                    15
                </button>

                <button
                    class="qt-btn"
                    data-qt="25"
                    type="button"
                >
                    25
                </button>

                <button
                    class="qt-btn"
                    data-qt="30"
                    type="button"
                >
                    30
                </button>

                <button
                    class="qt-btn"
                    data-qt="35"
                    type="button"
                >
                    35
                </button>

            </div>

        </div>


        <!-- 判斷按鈕 -->

        <button
            class="main-btn"
            onclick="calculate()"
        >
            判斷這張訂單
        </button>


        <!-- Error -->

        <div
            class="error"
            id="error"
        ></div>


        <!-- Result -->

        <div
            class="result"
            id="result"
        ></div>


    </div>

</div>


<script>

/* =========================
   QT 選擇
========================= */

let selectedQT = null;

const qtButtons =
    document.querySelectorAll(".qt-btn");

qtButtons.forEach(button => {

    button.addEventListener("click", () => {

        qtButtons.forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        selectedQT =
            Number(button.dataset.qt);

    });

});


/* =========================
   時間格式
========================= */

function formatTime(date) {

    return date.toLocaleTimeString(
        "zh-TW",
        {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }
    );

}


/* =========================
   主計算
========================= */

function calculate() {

    const orderValue =
        document.getElementById("orderTime").value;

    const estimatedValue =
        document.getElementById("estimatedTime").value;

    const result =
        document.getElementById("result");

    const error =
        document.getElementById("error");


    /* Reset */

    result.style.display = "none";
    error.style.display = "none";

    result.className = "result";


    /* 檢查輸入 */

    if (
        !orderValue ||
        !estimatedValue ||
        selectedQT === null
    ) {

        error.innerText =
            "請完整輸入時間並選擇 QT。";

        error.style.display = "block";

        return;

    }


    const orderTime =
        new Date(orderValue);

    const estimatedTime =
        new Date(estimatedValue);

    const qt =
        selectedQT;


    /* =========================
       判斷公式

       原預計送達時間
       - 落單時間
       - 14 分鐘
       > QT

       → 預約單

       其餘
       → 即時單
    ========================= */

    const totalMinutes =
        (estimatedTime - orderTime)
        / 1000
        / 60;

    const compareMinutes =
        totalMinutes - 14;


    let orderType = "";
    let targetTime = null;


    /* 預約單 */

    if (compareMinutes > qt) {

        orderType = "預約單";

        targetTime =
            estimatedTime;

    }

    /* 即時單 */

    else {

        orderType = "即時單";

        targetTime =
            new Date(
                orderTime.getTime()
                + 25 * 60 * 1000
            );

    }


    /* =========================
       判斷目前時間
    ========================= */

    const now =
        new Date();

    const stillOnTime =
        now <= targetTime;


    /* =========================
       預約單結果
    ========================= */

    if (orderType === "預約單") {

        result.className =
            "result reservation";

        result.innerHTML = `

            <div class="result-header">

                <div class="result-icon">
                    📅
                </div>

                <div class="result-type">
                    預約單
                </div>

            </div>


            <div class="action-area">

                <div class="action-label">
                    抵達追蹤時間
                </div>

                <div class="action-text">
                    請於此時間前完成「抵達」
                </div>

                <div class="deadline-time">
                    ${formatTime(targetTime)}
                </div>

            </div>

        `;

    }


    /* =========================
       即時單結果
    ========================= */

    else {

        result.className =
            "result instant";

        result.innerHTML = `

            <div class="result-header">

                <div class="result-icon">
                    ⚡
                </div>

                <div class="result-type">
                    即時單
                </div>

            </div>


            <div class="action-area">

                <div class="action-label">
                    最晚抵達時間
                </div>

                <div class="action-text">
                    請於此時間前完成「抵達」
                </div>

                <div class="deadline-time">
                    ${formatTime(targetTime)}
                </div>

            </div>

        `;

    }


    /* =========================
       追蹤狀態
    ========================= */

    if (stillOnTime) {

        result.innerHTML += `

            <div class="status ok">

                <div class="status-title">
                    🟢 持續配送追蹤中
                </div>

                <div class="status-text">
                    請依目標時間持續追蹤配送進度，
                    並於指定時間前完成「抵達」。
                </div>

            </div>

        `;

    }


    /* 已超過時間 */

    else {

        result.innerHTML += `

            <div class="status late">

                <div class="status-title">
                    📌 建議立即處理
                </div>

                <div class="status-text">

                    📞 聯絡顧客延長送達時間
                    <br>

                    🛠️ 修正 POS 時間

                    <br><br>

                    完成處理後，
                    請持續確認訂單配送進度。

                </div>

            </div>

        `;

    }


    /* =========================
       判斷明細
    ========================= */

    result.innerHTML += `

        <div class="detail">

            <div class="detail-title">
                判斷明細
            </div>


            <div class="detail-row">

                <span>
                    預計送達－落單
                </span>

                <span>
                    ${totalMinutes.toFixed(0)} 分鐘
                </span>

            </div>


            <div class="detail-row">

                <span>
                    扣除 14 分鐘
                </span>

                <span>
                    ${compareMinutes.toFixed(0)} 分鐘
                </span>

            </div>


            <div class="detail-row">

                <span>
                    選擇 QT
                </span>

                <span>
                    ${qt} 分鐘
                </span>

            </div>


            <div class="detail-row">

                <span>
                    判定
                </span>

                <span>
                    ${orderType}
                </span>

            </div>

        </div>

    `;


    result.style.display = "block";


    /* 自動捲動 */

    setTimeout(() => {

        result.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }, 100);

}

</script>

</body>
</html>
